<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TaskFlow</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-logo">Task<span>Flow</span></div>
      <p class="brand-tagline">A focused workspace for teams who ship. Assign, track, and close tasks without the noise.</p>
      <div class="brand-features">
        <div class="feat-item"><div class="feat-dot"></div> Role-based access for teams</div>
        <div class="feat-item"><div class="feat-dot"></div> Real-time task boards</div>
        <div class="feat-item"><div class="feat-dot"></div> Project-level dashboards</div>
        <div class="feat-item"><div class="feat-dot"></div> JWT-secured, </div>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-box">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to your workspace</p>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@company.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <p class="error-msg hidden" id="err-msg"></p>

        <button class="btn btn-primary mt-3" id="login-btn" onclick="doLogin()">
          Sign In
        </button>

        <p class="auth-switch">
          Don't have an account? <a href="signup.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      const errEl = document.getElementById('err-msg');
      const btn = document.getElementById('login-btn');

      errEl.classList.add('hidden');

      if (!email || !pwd) {
        errEl.textContent = 'Please fill in all fields';
        errEl.classList.remove('hidden');
        return;
      }

      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const result = await auth.login(email, pwd);
        saveTokens(result.access, result.refresh);
        saveCurrentUser(result.user);
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = err.error || handleApiError(err);
        errEl.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
