<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — TaskFlow</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">Task<span>Flow</span></div>
      <div class="sidebar-section">
        <div class="nav-item" onclick="window.location.href='index.html'">
          <span class="nav-icon">←</span> All Projects
        </div>
      </div>
      <div class="sidebar-projects">
        <div class="sidebar-label">This Project</div>
        <div class="nav-item active" onclick="switchTab('board')">
          <span class="nav-icon">⊞</span> Task Board
        </div>
        <div class="nav-item" onclick="switchTab('dashboard')">
          <span class="nav-icon">◎</span> Dashboard
        </div>
        <div class="nav-item" id="members-nav-item" onclick="switchTab('members')">
          <span class="nav-icon">◉</span> Members
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="user-avatar" id="sidebar-avatar">?</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-name">—</div>
            <div class="user-email" id="sidebar-email">—</div>
          </div>
          <button class="logout-btn" onclick="logout()">⏻</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="proj-title">Loading...</h1>
          <p class="page-sub" id="proj-desc"></p>
        </div>
        <div class="flex gap-2">
          <span id="my-role-badge" class="project-role-badge"></span>
          <button class="btn btn-ghost btn-sm" id="add-task-btn" onclick="openTaskModal()" style="display:none">+ Add Task</button>
        </div>
      </div>

      <!-- Board Tab -->
      <div id="tab-board">
        <div class="board-wrap">
          <div class="board-col">
            <div class="col-header">
              <div class="col-title"><div class="col-dot dot-todo"></div> To Do</div>
              <span class="col-count" id="count-todo">0</span>
            </div>
            <div id="col-todo"></div>
          </div>
          <div class="board-col">
            <div class="col-header">
              <div class="col-title"><div class="col-dot dot-progress"></div> In Progress</div>
              <span class="col-count" id="count-progress">0</span>
            </div>
            <div id="col-progress"></div>
          </div>
          <div class="board-col">
            <div class="col-header">
              <div class="col-title"><div class="col-dot dot-done"></div> Done</div>
              <span class="col-count" id="count-done">0</span>
            </div>
            <div id="col-done"></div>
          </div>
        </div>
      </div>

      <!-- Dashboard Tab -->
      <div id="tab-dashboard" class="hidden">
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-num" id="dash-total">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-box stat-progress">
            <div class="stat-num" id="dash-progress">0</div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-box stat-done">
            <div class="stat-num" id="dash-done">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-box stat-overdue">
            <div class="stat-num" id="dash-overdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
        </div>

        <div class="card mt-4">
          <h3 class="fw-bold" style="margin-bottom:16px">Tasks per Member</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Member</th>
                  <th>Role</th>
                  <th>Assigned</th>
                  <th>Done</th>
                  <th>Completion</th>
                </tr>
              </thead>
              <tbody id="dash-member-rows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Members Tab -->
      <div id="tab-members" class="hidden">
        <div class="card">
          <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:20px">
            <h3 class="fw-bold">Team Members</h3>
            <button class="btn btn-ghost btn-sm" id="add-member-btn" onclick="openAddMemberModal()" style="display:none">+ Add Member</button>
          </div>
          <div class="members-list" id="members-list"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal (create/edit) -->
  <div class="modal-backdrop hidden" id="task-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="task-modal-title">New Task</h2>
        <button class="modal-close" onclick="closeTaskModal()">✕</button>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" id="task-title" placeholder="What needs to be done?" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="task-desc" placeholder="Optional details..."></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="task-due" />
        </div>
      </div>
      <div class="field" id="task-assign-wrap">
        <label>Assign To</label>
        <select id="task-assignee">
          <option value="">— Unassigned —</option>
        </select>
      </div>
      <div class="field" id="task-status-wrap" style="display:none">
        <label>Status</label>
        <select id="task-status">
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <p class="error-msg hidden" id="task-err"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" onclick="closeTaskModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" style="width:auto" id="task-submit-btn" onclick="submitTask()">Create Task</button>
      </div>
    </div>
  </div>

  <!-- Task Detail/Edit Modal -->
  <div class="modal-backdrop hidden" id="task-detail-modal">
    <div class="modal" style="max-width:520px">
      <div class="modal-header">
        <h2 class="modal-title" id="detail-title">Task</h2>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div id="detail-body"></div>
      <div class="modal-footer" id="detail-footer"></div>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div class="modal-backdrop hidden" id="member-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add Member</h2>
        <button class="modal-close" onclick="closeMemberModal()">✕</button>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="member-email" placeholder="teammate@company.com" />
      </div>
      <div class="field">
        <label>Role</label>
        <select id="member-role">
          <option value="member">Member</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <p class="error-msg hidden" id="member-err"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" onclick="closeMemberModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" style="width:auto" onclick="addMember()">Add Member</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (!requireAuth()) throw new Error('not authed');

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    if (!projectId) window.location.href = 'index.html';

    let project = null;
    let myRole = null;
    let allTasks = [];
    let editingTaskId = null;
    const me = getCurrentUser();

    async function init() {
      if (me) {
        document.getElementById('sidebar-name').textContent = me.name;
        document.getElementById('sidebar-email').textContent = me.email;
        document.getElementById('sidebar-avatar').textContent = initials(me.name);
      }

      try {
        project = await projectsApi.get(projectId);
        myRole = project.my_role;

        document.getElementById('proj-title').textContent = project.name;
        document.getElementById('proj-desc').textContent = project.description || '';

        const badge = document.getElementById('my-role-badge');
        badge.textContent = myRole;
        badge.className = `project-role-badge ${myRole === 'admin' ? 'role-admin' : 'role-member'}`;

        if (myRole === 'admin') {
          document.getElementById('add-task-btn').style.display = '';
          document.getElementById('add-member-btn').style.display = '';
        }

        await loadTasks();
      } catch (e) {
        showToast('Failed to load project', 'error');
      }
    }

    async function loadTasks() {
      allTasks = await tasksApi.list(projectId);
      renderBoard(allTasks);
    }

    function renderBoard(tasks) {
      const cols = { todo: [], in_progress: [], done: [] };
      tasks.forEach(t => {
        if (cols[t.status]) cols[t.status].push(t);
        else cols.todo.push(t);
      });

      renderCol('col-todo', 'count-todo', cols.todo);
      renderCol('col-progress', 'count-progress', cols.in_progress);
      renderCol('col-done', 'count-done', cols.done);
    }

    function renderCol(colId, countId, tasks) {
      const col = document.getElementById(colId);
      document.getElementById(countId).textContent = tasks.length;
      col.innerHTML = '';

      if (!tasks.length) {
        col.innerHTML = '<div class="text-muted text-sm" style="text-align:center;padding:20px">Nothing here</div>';
        return;
      }

      tasks.forEach(t => {
        const card = el('div', 'task-card');
        const due = t.due_date ? `<span class="task-due ${t.is_overdue ? 'overdue' : ''}">${t.is_overdue ? '⚠ ' : ''}${formatDate(t.due_date)}</span>` : '';
        card.innerHTML = `
          <div class="task-title">${t.title}</div>
          <div class="task-tags">
            ${priorityTag(t.priority)}
            ${due}
          </div>
          ${t.assigned_to ? `<div class="task-assignee">→ ${t.assigned_to.name}</div>` : ''}
        `;
        card.onclick = () => openDetailModal(t);
        col.appendChild(card);
      });
    }

    // ---------- TABS ----------
    let activeTab = 'board';

    function switchTab(tab) {
      ['board', 'dashboard', 'members'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      activeTab = tab;

      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (tab === 'dashboard') loadDashboard();
      if (tab === 'members') renderMembers();
    }

    async function loadDashboard() {
      try {
        const data = await tasksApi.dashboard(projectId);
        document.getElementById('dash-total').textContent = data.total;
        document.getElementById('dash-progress').textContent = data.by_status.in_progress;
        document.getElementById('dash-done').textContent = data.by_status.done;
        document.getElementById('dash-overdue').textContent = data.overdue;

        const tbody = document.getElementById('dash-member-rows');
        tbody.innerHTML = '';
        data.per_member.forEach(m => {
          const pct = m.assigned ? Math.round((m.done / m.assigned) * 100) : 0;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${m.user}</strong></td>
            <td><span class="project-role-badge ${m.role === 'admin' ? 'role-admin' : 'role-member'}">${m.role}</span></td>
            <td class="mono">${m.assigned}</td>
            <td class="mono text-accent">${m.done}</td>
            <td class="mono">${pct}%</td>
          `;
          tbody.appendChild(row);
        });
      } catch (e) {
        showToast('Failed to load dashboard', 'error');
      }
    }

    function renderMembers() {
      if (!project) return;
      const list = document.getElementById('members-list');
      list.innerHTML = '';
      project.members.forEach(m => {
        const row = el('div', 'member-row');
        row.innerHTML = `
          <div class="member-avatar">${initials(m.user.name)}</div>
          <div class="member-info">
            <div class="member-name">${m.user.name} ${m.user.id === (me && me.id) ? '<span class="text-muted text-sm">(you)</span>' : ''}</div>
            <div class="member-email">${m.user.email}</div>
          </div>
          <span class="project-role-badge ${m.role === 'admin' ? 'role-admin' : 'role-member'}">${m.role}</span>
          ${myRole === 'admin' && m.user.id !== (me && me.id) ? `<button class="btn btn-danger btn-sm" onclick="removeMember(${m.user.id})">Remove</button>` : ''}
        `;
        list.appendChild(row);
      });
    }

    // ---------- TASK MODAL ----------
    function openTaskModal(taskToEdit = null) {
      editingTaskId = taskToEdit ? taskToEdit.id : null;

      document.getElementById('task-modal-title').textContent = taskToEdit ? 'Edit Task' : 'New Task';
      document.getElementById('task-submit-btn').textContent = taskToEdit ? 'Save Changes' : 'Create Task';
      document.getElementById('task-err').classList.add('hidden');

      // fill assignee dropdown
      const sel = document.getElementById('task-assignee');
      sel.innerHTML = '<option value="">— Unassigned —</option>';
      project.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.user.id;
        opt.textContent = m.user.name;
        sel.appendChild(opt);
      });

      if (taskToEdit) {
        document.getElementById('task-title').value = taskToEdit.title;
        document.getElementById('task-desc').value = taskToEdit.description || '';
        document.getElementById('task-priority').value = taskToEdit.priority;
        document.getElementById('task-due').value = taskToEdit.due_date || '';
        sel.value = taskToEdit.assigned_to ? taskToEdit.assigned_to.id : '';
        document.getElementById('task-status').value = taskToEdit.status;
        document.getElementById('task-status-wrap').style.display = '';
      } else {
        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-priority').value = 'medium';
        document.getElementById('task-due').value = '';
        sel.value = '';
        document.getElementById('task-status-wrap').style.display = 'none';
      }

      // members can only update status — hide full form for them
      const isAdmin = myRole === 'admin';
      document.getElementById('task-assign-wrap').style.display = isAdmin ? '' : 'none';

      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
      editingTaskId = null;
    }

    async function submitTask() {
      const title = document.getElementById('task-title').value.trim();
      const desc = document.getElementById('task-desc').value.trim();
      const priority = document.getElementById('task-priority').value;
      const due = document.getElementById('task-due').value;
      const assigneeId = document.getElementById('task-assignee').value;
      const status = document.getElementById('task-status').value;
      const errEl = document.getElementById('task-err');

      errEl.classList.add('hidden');

      if (!title) {
        errEl.textContent = 'Title is required';
        errEl.classList.remove('hidden');
        return;
      }

      const payload = { title, description: desc, priority };
      if (due) payload.due_date = due;
      if (assigneeId) payload.assigned_to_id = parseInt(assigneeId);
      if (editingTaskId) payload.status = status;

      try {
        if (editingTaskId) {
          await tasksApi.update(projectId, editingTaskId, payload);
          showToast('Task updated!');
        } else {
          await tasksApi.create(projectId, payload);
          showToast('Task created!');
        }
        closeTaskModal();
        closeDetailModal();
        await loadTasks();
      } catch (err) {
        errEl.textContent = handleApiError(err);
        errEl.classList.remove('hidden');
      }
    }

    // ---------- DETAIL MODAL ----------
    function openDetailModal(task) {
      document.getElementById('detail-title').textContent = task.title;

      const body = document.getElementById('detail-body');
      body.innerHTML = `
        <div class="task-tags" style="margin-bottom:14px">
          ${priorityTag(task.priority)}
          <span class="tag" style="background:var(--surface2);color:var(--muted)">${task.status.replace('_', ' ')}</span>
          ${task.is_overdue ? '<span class="tag tag-high">⚠ overdue</span>' : ''}
        </div>
        ${task.description ? `<p class="text-sm" style="margin-bottom:14px;color:var(--muted)">${task.description}</p>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:0.85rem">
          <div><span class="text-muted mono">Assigned to</span><br>${task.assigned_to ? task.assigned_to.name : '—'}</div>
          <div><span class="text-muted mono">Due date</span><br>${formatDate(task.due_date)}</div>
          <div><span class="text-muted mono">Created by</span><br>${task.created_by ? task.created_by.name : '—'}</div>
        </div>
      `;

      const footer = document.getElementById('detail-footer');
      footer.innerHTML = '';

      if (myRole === 'admin') {
        const editBtn = el('button', 'btn btn-ghost btn-sm', 'Edit Task');
        editBtn.onclick = () => { closeDetailModal(); openTaskModal(task); };
        const delBtn = el('button', 'btn btn-danger btn-sm', 'Delete');
        delBtn.onclick = () => deleteTask(task.id);
        footer.appendChild(editBtn);
        footer.appendChild(delBtn);
      } else if (task.assigned_to && task.assigned_to.id === (me && me.id)) {
        // member assigned to this task can update status
        const statusSel = document.createElement('select');
        statusSel.className = 'field';
        statusSel.style = 'background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--sans);';
        ['todo', 'in_progress', 'done'].forEach(s => {
          const o = document.createElement('option');
          o.value = s;
          o.textContent = s.replace('_', ' ');
          if (s === task.status) o.selected = true;
          statusSel.appendChild(o);
        });

        const saveBtn = el('button', 'btn btn-primary btn-sm', 'Update Status');
        saveBtn.style.width = 'auto';
        saveBtn.onclick = async () => {
          try {
            await tasksApi.update(projectId, task.id, { status: statusSel.value });
            closeDetailModal();
            await loadTasks();
            showToast('Status updated!');
          } catch (e) {
            showToast(handleApiError(e), 'error');
          }
        };
        footer.appendChild(statusSel);
        footer.appendChild(saveBtn);
      }

      const closeBtn = el('button', 'btn btn-ghost btn-sm', 'Close');
      closeBtn.onclick = closeDetailModal;
      footer.appendChild(closeBtn);

      document.getElementById('task-detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('task-detail-modal').classList.add('hidden');
    }

    async function deleteTask(taskId) {
      if (!confirm('Delete this task? This cannot be undone.')) return;
      try {
        await tasksApi.delete(projectId, taskId);
        closeDetailModal();
        await loadTasks();
        showToast('Task deleted');
      } catch (e) {
        showToast('Failed to delete task', 'error');
      }
    }

    // ---------- MEMBERS ----------
    function openAddMemberModal() {
      document.getElementById('member-email').value = '';
      document.getElementById('member-role').value = 'member';
      document.getElementById('member-err').classList.add('hidden');
      document.getElementById('member-modal').classList.remove('hidden');
    }

    function closeMemberModal() {
      document.getElementById('member-modal').classList.add('hidden');
    }

    async function addMember() {
      const email = document.getElementById('member-email').value.trim();
      const role = document.getElementById('member-role').value;
      const errEl = document.getElementById('member-err');

      if (!email) {
        errEl.textContent = 'Email is required';
        errEl.classList.remove('hidden');
        return;
      }

      try {
        await projectsApi.addMember(projectId, email, role);
        closeMemberModal();
        project = await projectsApi.get(projectId);
        renderMembers();
        showToast('Member added!');
      } catch (err) {
        errEl.textContent = handleApiError(err);
        errEl.classList.remove('hidden');
      }
    }

    async function removeMember(userId) {
      if (!confirm('Remove this member from the project?')) return;
      try {
        await projectsApi.removeMember(projectId, userId);
        project = await projectsApi.get(projectId);
        renderMembers();
        showToast('Member removed');
      } catch (e) {
        showToast(handleApiError(e), 'error');
      }
    }

    function logout() {
      clearTokens();
      window.location.href = 'login.html';
    }

    init();
  </script>
</body>
</html>
